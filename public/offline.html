<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563EB" />
  <title>You're offline — Assessify</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f8fafc;color:#0f172a;text-align:center;padding:24px}
    .card{max-width:380px}
    img{width:72px;height:72px;border-radius:16px}
    h1{font-size:22px;margin:20px 0 8px}
    p{color:#475569;line-height:1.6;margin:0 0 24px}
    button{background:#2563EB;color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:16px;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="Assessify" />
    <h1>You're offline</h1>
    <p>Assessify needs an internet connection to load practice questions and save your answers. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
